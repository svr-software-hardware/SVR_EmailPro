metadata:
  name: payments
  type: core_entity
  description: "Pagos exitosos realizados para extender la vigencia de los dominios de EmailPro."

database_schema:
  table: payments
  table_es: "pagos"
  timestamps: true

  fields:
    domain_id:
      type: bigint unsigned
      references: domains.id
      description: "Dominio cuya vigencia fue pagada."

    payment_term_id:
      type: bigint unsigned
      references: payment_terms.id
      description: "Periodo seleccionado para realizar el pago."

    payment_intent_id:
      type: bigint unsigned
      unique: true
      references: payment_intents.id
      description: "Intento confirmado que originó el pago y que impide registrar dos pagos para la misma operación."

    mailbox_quantity:
      type: integer unsigned
      description: "Capacidad de cuentas de correo cobrada al momento del pago."

    customer_unit_price:
      type: decimal 11,2
      description: "Precio mensual por cuenta de correo aplicado al cliente."

    distributor_unit_cost:
      type: decimal 11,2
      description: "Costo mensual por cuenta de correo aplicado al distribuidor."

    months:
      type: integer unsigned
      description: "Cantidad de meses pagados conservada como valor histórico."

    gross_amount:
      type: decimal 11,2
      description: "Importe total pagado por el cliente."

    svr_amount:
      type: decimal 11,2
      description: "Importe del pago correspondiente a SVR."

    distributor_amount:
      type: decimal 11,2
      description: "Importe del pago correspondiente al distribuidor y pendiente de liquidación."

    external_transaction_id:
      type: string 100
      unique: true
      description: "Identificador de la transacción exitosa proporcionado por el proveedor de pagos."

    authorization:
      type: string 100
      not_null: false
      description: "Código de autorización devuelto por el proveedor para el cargo exitoso."

    invoice_status:
      type: string 20
      default: "pending"
      description: "Estado actual de la facturación del pago."

    invoice_provider_id:
      type: string 100
      not_null: false
      unique: true
      description: "Identificador de la factura generada mediante el proveedor de facturación."

    invoice_uuid:
      type: string 100
      not_null: false
      unique: true
      description: "Folio fiscal UUID de la factura generada."

    invoiced_at:
      type: datetime
      not_null: false
      description: "Fecha y hora en que la facturación fue confirmada."

    invoice_error:
      type: text
      not_null: false
      description: "Último mensaje de error de facturación conservado para diagnóstico y reintento."

    previous_expires_at:
      type: date
      description: "Fecha de expiración del dominio antes de aplicar el pago."

    new_expires_at:
      type: date
      description: "Fecha de expiración del dominio después de aplicar el pago."
