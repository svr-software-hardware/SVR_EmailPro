metadata:
  name: fiscal_regimes
  type: general_catalog
  description: "Regímenes fiscales disponibles para los perfiles fiscales de EmailPro."

database_schema:
  table: fiscal_regimes
  table_es: "regímenes fiscales"

  fields:
    code:
      type: string 3
      unique: true
      description: "Clave oficial del régimen fiscal."

    name:
      type: string 150
      description: "Nombre del régimen fiscal."

    is_individual:
      type: boolean
      description: "Indica si el régimen fiscal aplica a personas físicas."

    is_legal_entity:
      type: boolean
      description: "Indica si el régimen fiscal aplica a personas morales."

